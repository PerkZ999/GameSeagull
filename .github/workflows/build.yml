name: Build GameSeagull

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl unzip zip xz-utils
          sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos (Linux)
        run: |
          export THEOS=$HOME/theos
          export CI=true
          # --recursive pulls theos + vendor + the patched sdks submodule (incl. iPhoneOS14.5.sdk)
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          ls "$THEOS/sdks" | grep -i sdk | head -3 || echo "[!] no SDKs found in submodule"
          # installer: adjusts fakeroot, downloads the Linux iOS toolchain, finishes setup
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          ls "$THEOS/toolchain/linux/iphone/bin/clang" && echo "[+] toolchain OK"

      - name: Install Cephei
        run: |
          export THEOS=$HOME/theos
          curl -sL https://api.github.com/repos/hbang/libcephei/releases/latest \
            | grep -Eo 'https://[^"]+\.deb' | head -1 | xargs curl -sL -o /tmp/cephei.deb
          mkdir -p /tmp/cephei && dpkg-deb -x /tmp/cephei.deb /tmp/cephei
          mkdir -p "$THEOS/lib" "$THEOS/include"
          cp -R /tmp/cephei/usr/lib/. "$THEOS/lib/" 2>/dev/null || true
          cp -R /tmp/cephei/var/jb/usr/lib/. "$THEOS/lib/" 2>/dev/null || true
          cp -R /tmp/cephei/usr/include/. "$THEOS/include/" 2>/dev/null || true
          cp -R /tmp/cephei/var/jb/usr/include/. "$THEOS/include/" 2>/dev/null || true
          find "$THEOS/lib" -maxdepth 1 -name "*.framework" || true

      - name: Build .deb packages (rootful + rootless)
        run: |
          export THEOS=$HOME/theos
          ./build_release.sh

      - name: Build TrollStore IPA
        run: |
          export THEOS=$HOME/theos
          ./make_ipa.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameSeagull-2.2
          path: |
            build/*.deb
            GameSeagull-2.2.ipa
          if-no-files-found: error
